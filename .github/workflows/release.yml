name: Release

# A version tag gets a GitHub release page, with that version's section of the
# changelog for its notes. Packagist reads the tag itself; this is the page people
# read, and what "Watch → Releases" notifies about.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag's own changelog: its section runs from "## <version> - <date>" to
          # the next "## " heading
          notes=$(awk -v v="$TAG" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md | sed '/./,$!d')
          heading=$(grep -m1 -E "^## ${TAG//./\\.}( |$)" CHANGELOG.md || true)

          if [ -z "$heading" ] || [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $TAG."
            exit 1
          fi

          # A release is dated in its heading; "Unreleased" means the changelog wasn't
          # updated in the release commit
          if ! printf '%s' "$heading" | grep -qE ' - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::The changelog heading for $TAG isn't dated: $heading"
            exit 1
          fi

          printf '%s\n' "$notes" > notes.md

          # Betas, RCs and the like are pre-releases
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
          fi
